services:
  sead-buried-stories:
    build:
      context: .
      dockerfile: Containerfile
    image: sead-buried-stories:latest
    container_name: sead-buried-stories
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "9050"
    ports:
      - "127.0.0.1:9050:9050"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
